[package]
name = "omr-sheet-music-viewer"
version = "0.1.0"
description = "Local PDF sheet-music viewer powered by HOMR"
authors = ["HOMR contributors"]
edition = "2021"

[lib]
name = "omr_sheet_music_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
midir = "0.11"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2", features = ["v2_40"] }
