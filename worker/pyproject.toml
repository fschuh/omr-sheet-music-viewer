[project]
name = "sheet-music-worker"
version = "0.1.0"
description = "Local PDF rasterization and HOMR orchestration for the sheet-music viewer"
requires-python = ">=3.11,<3.16"
dependencies = [
  "homr @ git+https://github.com/fschuh/homr@main",
  "pypdfium2>=5,<6",
]

# Installing this extra only enables the GPU when the installer puts onnxruntime-gpu
# down after onnxruntime; both ship the same native libraries and the last one wins.
# Poetry orders them correctly, pip does not — see the README.
[project.optional-dependencies]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.24.1,<2"]

[project.scripts]
sheet-music-worker = "sheet_music_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The homr dependency is a git URL, which hatchling rejects by default.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

