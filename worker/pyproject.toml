[project]
name = "sheet-music-worker"
version = "0.1.0"
description = "Local PDF rasterization and HOMR orchestration for the sheet-music viewer"
requires-python = ">=3.11,<3.16"
dependencies = [
  "homr @ git+https://github.com/fschuh/homr@main",
  "pypdfium2>=5,<6",
]

# homr installs no inference engine on its own: onnxruntime and onnxruntime-gpu ship the
# same native libraries under the same names, so it exposes them as mutually exclusive
# extras rather than letting an environment hold both and silently run whichever wheel was
# written last. Exactly one of these must be installed, and installing neither leaves a
# worker that cannot start — so every documented install names one.
[project.optional-dependencies]
cpu = ["homr[cpu] @ git+https://github.com/fschuh/homr@main"]
cuda = ["homr[cuda] @ git+https://github.com/fschuh/homr@main"]

[project.scripts]
sheet-music-worker = "sheet_music_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The homr dependency is a git URL, which hatchling rejects by default.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

