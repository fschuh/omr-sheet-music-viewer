[project]
name = "homr-sheet-music-viewer"
version = "0.1.0"
description = "Local PDF sheet-music viewer powered by the bundled HOMR fork"
requires-python = ">=3.11,<3.16"
dependencies = [
  "homr",
  "sheet-music-worker",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
homr = { path = "vendor/homr", editable = true }
sheet-music-worker = { path = "worker", editable = true }
